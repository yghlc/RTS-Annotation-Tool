{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTS Annotation Tool · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --text:#f1f6f8; --muted:#c0cdd3; --faint:#8ea0a8;
  --ice:#7cc0f0; --ice-deep:#2f708f; --rust:#d18f68;
  --line:rgba(150,180,195,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;
  display:flex;align-items:center;justify-content:center;padding:32px;background:#0a1820;
  -webkit-font-smoothing:antialiased;
}
/* full-bleed RTS photo */
body::before{
  content:'';position:fixed;inset:-20px;z-index:-2;
  background:url('{% static "bg.png" %}') center/cover no-repeat;
  filter:blur(2px) saturate(1.05);transform:scale(1.06);
}
/* stronger darkening — no card, so the background must carry the contrast */
body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(760px 620px at 50% 50%, rgba(8,20,26,.55), transparent 70%),
    linear-gradient(180deg, rgba(8,20,26,.68) 0%, rgba(7,17,23,.72) 45%, rgba(6,15,20,.82) 100%);
}

/* ---------- borderless content column ---------- */
.panel{
  position:relative;width:100%;max-width:340px;
  text-shadow:0 1px 12px rgba(0,0,0,.5);
}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.logo-icon{
  width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--ice-deep),#4b93b3);
  box-shadow:0 8px 22px -8px rgba(0,0,0,.8), 0 0 0 1px rgba(140,200,240,.35) inset;
}
.logo-text{font-size:15px;font-weight:700;letter-spacing:.01em}
.logo-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:"IBM Plex Mono",monospace}

h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:26px;font-weight:600;margin-bottom:7px;letter-spacing:-.01em}
.subtitle{font-size:13.5px;color:var(--muted);margin-bottom:30px}

.error{
  background:rgba(218,54,51,.22);border:1px solid rgba(255,120,110,.5);border-radius:8px;
  color:#ffb3ac;font-size:13px;padding:10px 13px;margin-bottom:18px;line-height:1.45;
  text-shadow:none;backdrop-filter:blur(6px);
}
.field{margin-bottom:17px}
label{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;
}
.optional{color:var(--faint);font-weight:500;text-transform:none;letter-spacing:0;margin-left:4px}
input[type=email],input[type=text]{
  width:100%;background:rgba(6,15,20,.55);border:1px solid var(--line);border-radius:9px;
  color:var(--text);font-size:14px;font-family:inherit;padding:12px 15px;outline:none;
  text-shadow:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input::placeholder{color:#7f9199}
input:focus{border-color:var(--ice);background:rgba(6,15,20,.72);box-shadow:0 0 0 3px rgba(124,192,240,.18)}
.btn-submit{
  width:100%;margin-top:10px;padding:13px;position:relative;
  background:linear-gradient(180deg,#4295b8,var(--ice-deep));
  border:1px solid rgba(124,192,240,.45);border-radius:9px;
  color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;text-shadow:none;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.85), 0 1px 0 rgba(255,255,255,.2) inset;
  transition:filter .15s,transform .05s;
}
.btn-submit:hover{filter:brightness(1.1)}
.btn-submit:active{transform:translateY(1px);filter:brightness(.96)}

.guide{margin-top:22px;font-size:12.5px;color:var(--muted)}
.guide a{color:var(--ice);text-decoration:none;border-bottom:1px solid rgba(124,192,240,.4)}
.guide a:hover{border-color:var(--ice)}
.footer{margin-top:26px;font-size:11px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
</style>
</head>
<body>
<div class="panel">
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="#eaf4fb" stroke-width="1.3" opacity=".38"/>
        <circle cx="12" cy="12" r="5.4" fill="none" stroke="#eaf4fb" stroke-width="1.6" opacity=".72"/>
        <circle cx="12" cy="12" r="2.1" fill="#eaf4fb"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">RTS Annotator</div>
      <div class="logo-sub">Retrogressive Thaw Slump · SAM2</div>
    </div>
  </div>

  <h1>Sign in</h1>
  <p class="subtitle">Enter your authorized email to continue</p>

  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" autofocus autocomplete="email" required>
    </div>
    <div class="field">
      <label>Display name <span class="optional">· optional</span></label>
      <input type="text" name="name" placeholder="Your name">
    </div>
    <button type="submit" class="btn-submit">Sign in →</button>
  </form>

  <p class="guide">
    First time here?
    <a href="https://chenyufei030316-max.github.io/RTS-Annotation-Tool/" target="_blank" rel="noopener">Read the guide</a>
  </p>

  <div class="footer">Arctic permafrost mapping · Internal tool</div>
</div>
</body>
</html>
